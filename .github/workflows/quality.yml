name: Run tests and static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Run tests and static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up PHP environment
        uses: shivammathur/setup-php@0b3aa3e956e05acdd8d6d246bce4a2010b36df7a
        with:
          php-version: 8.2
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction
      - name: Run promise smoke tests
        run: composer test
      - name: Run PHPStan at maximum level
        run: composer analyse
